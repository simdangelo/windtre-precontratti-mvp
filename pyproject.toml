[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windtre-sintesi-trasparenze"
version = "0.1.0"
description = "WINDTRE Sintesi & Trasparenze automation backend"
readme = "README.MD"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.135",
    "httpx>=0.28",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.32",
    "requests>=2.34",
    "spire-xls>=16.8.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-openpyxl>=3.1.5",
    "types-requests>=2.33",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
